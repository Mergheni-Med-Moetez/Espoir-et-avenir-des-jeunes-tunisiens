# =============================================================================
# Pytest Configuration for Tunisian Hope & Future
# =============================================================================
# EXAM DEFENSE: We use pytest instead of Django's default unittest runner
# because pytest gives us:
#   - Shorter, more readable test syntax (plain assert instead of self.assertEqual)
#   - Better error messages showing exactly what failed
#   - Fixtures with dependency injection (cleaner test setup)
#   - Parametrized tests (test multiple inputs with one function)
# =============================================================================

[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
